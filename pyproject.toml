[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "chess-agent-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-chess>=1.999", "pydantic>=2", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pyyaml>=6", "openai>=1.50"]
[project.optional-dependencies]
test = ["pytest", "httpx"]
[tool.setuptools.packages.find]
include = ["backend*"]
